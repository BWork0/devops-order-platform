- name: Configure Jenkins build agent
  hosts: ci_agents
  become: true
  roles:
    - docker

  tasks:
    - name: Install build tools
      ansible.builtin.apt:
        name:
          - git
          - openjdk-21-jdk
        state: present
        update_cache: true

    - name: Configure Docker for Nexus HTTP registry
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: "0644"
        content: |
          {
            "insecure-registries": [
              "10.10.10.100:8081"
            ]
          }
      notify: Restart Docker
    
    - name: Create Jenkins agent user
      ansible.builtin.user:
        name: jenkins
        shell: /bin/bash
        create_home: true
        groups: docker
        append: true

    - name: Add Jenkins agent public key
      ansible.posix.authorized_key:
        user: jenkins
        state: present
        key: "{{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'HOME') + '/.ssh/jenkins_ci_agent.pub') }}"
    
    - name: Install kubectl prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true

    - name: Create Kubernetes apt keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Kubernetes signing key
      ansible.builtin.get_url:
        url: https://pkgs.k8s.io/core:/stable:/v1.37/deb/Release.key
        dest: /tmp/kubernetes-release.key
        mode: "0644"

    - name: Install Kubernetes repository key
      ansible.builtin.command:
        cmd: >
          gpg --dearmor
          -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
          /tmp/kubernetes-release.key
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Add Kubernetes apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.37/deb/ /"
        filename: kubernetes
        state: present

    - name: Install kubectl
      ansible.builtin.apt:
        name: kubectl
        state: present
        update_cache: true
    
    - name: Set Helm version
      ansible.builtin.set_fact:
        helm_version: "v4.3.0"

    - name: Download Helm
      ansible.builtin.get_url:
        url: "https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz"
        dest: "/tmp/helm-{{ helm_version }}-linux-amd64.tar.gz"
        mode: "0644"

    - name: Extract Helm
      ansible.builtin.unarchive:
        src: "/tmp/helm-{{ helm_version }}-linux-amd64.tar.gz"
        dest: /tmp
        remote_src: true
        creates: "/tmp/linux-amd64/helm"

    - name: Install Helm binary
      ansible.builtin.copy:
        src: /tmp/linux-amd64/helm
        dest: /usr/local/bin/helm
        owner: root
        group: root
        mode: "0755"
        remote_src: true

  handlers:
    - name: Restart Docker
      ansible.builtin.systemd:
        name: docker
        state: restarted