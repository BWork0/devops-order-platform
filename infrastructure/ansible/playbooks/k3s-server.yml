- name: Install K3s server
  hosts: k3s_servers
  become: true

  vars:
    k3s_version: "v1.37.1+k3s1"
    k3s_server_ip: "10.10.10.101"

  tasks:
    - name: Install required packages
      ansible.builtin.apt:
        name:
          - curl
        state: present
        update_cache: true

    - name: Create K3s configuration directory
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configure K3s server
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        owner: root
        group: root
        mode: "0600"
        content: |
          node-ip: {{ k3s_server_ip }}
          advertise-address: {{ k3s_server_ip }}
      notify: Restart K3s

    - name: Download K3s installer
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /tmp/install-k3s.sh
        mode: "0755"

    - name: Install K3s server
      ansible.builtin.command:
        cmd: /tmp/install-k3s.sh server
        creates: /usr/local/bin/k3s
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"

    - name: Ensure K3s is enabled and running
      ansible.builtin.systemd:
        name: k3s
        enabled: true
        state: started

  handlers:
    - name: Restart K3s
      ansible.builtin.systemd:
        name: k3s
        state: restarted