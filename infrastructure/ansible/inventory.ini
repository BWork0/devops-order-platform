[cicd_servers]
cicd ansible_host=10.10.10.100 ansible_user=vagrant ansible_ssh_private_key_file=~/.ssh/cicd2_key

[ci_agents]
ci-agent ansible_host=10.10.10.104 ansible_user=vagrant ansible_ssh_private_key_file=~/.ssh/ci-agent_key

[k3s_servers]
k3s-server ansible_host=10.10.10.101 ansible_user=vagrant ansible_ssh_private_key_file=~/.ssh/k3s-server_key

[k3s_agents]
k3s-worker-1 ansible_host=10.10.10.102 ansible_user=vagrant ansible_ssh_private_key_file=~/.ssh/k3s-worker-1_key
k3s-worker-2 ansible_host=10.10.10.103 ansible_user=vagrant ansible_ssh_private_key_file=~/.ssh/k3s-worker-2_key