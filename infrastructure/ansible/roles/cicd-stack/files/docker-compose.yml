services:
  gitea-db:
    image: postgres:18
    container_name: gitea-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gitea
      POSTGRES_PASSWORD: gitea
      POSTGRES_DB: gitea
    volumes:
      - /opt/ci/gitea/postgres:/var/lib/postgresql
    networks:
      - gitea-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitea -d gitea"]
      interval: 10s
      timeout: 5s
      retries: 5

  gitea:
    image: docker.gitea.com/gitea:28.0.0
    container_name: gitea
    restart: unless-stopped
    depends_on:
      gitea-db:
        condition: service_healthy
    ports:
      - "3000:3000"
      - "2222:22"
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: gitea-db:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: gitea
      GITEA__database__PASSWD: gitea
    volumes:
      - /opt/ci/gitea/data:/data
    networks:
      - ci
      - gitea-db

  jenkins:
    image: jenkins/jenkins:2.580.1-lts-jdk21
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - /opt/ci/jenkins/data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "998"
    networks:
      - ci

  nexus:
    image: sonatype/nexus3:3.96.4-alpine
    container_name: nexus
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - /opt/ci/nexus/data:/nexus-data
    networks:
      - ci

networks:
  ci:
  gitea-db:
