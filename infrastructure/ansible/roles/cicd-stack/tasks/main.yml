- name: Create CI/CD root directory
  ansible.builtin.file:
    path: "{{ ci_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create service data directories
  ansible.builtin.file:
    path: "{{ ci_root }}/{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "0755"
  loop: "{{ ci_directories }}"
  loop_control:
    label: "{{ item.path }}"

- name: Deploy docker-compose.yml
  ansible.builtin.copy:
    src: docker-compose.yml
    dest: "{{ ci_root }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Start CI/CD stack
  community.docker.docker_compose_v2:
    project_src: "{{ ci_root }}"
    state: present
