docker_conflicting_packages:
  - docker.io
  - docker-compose
  - docker-compose-v2
  - docker-doc
  - docker-buildx
  - podman-docker
  - containerd
  - runc

docker_required_packages:
  - ca-certificates
  - curl

docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

docker_gpg_key_url: https://download.docker.com/linux/ubuntu/gpg
docker_keyring_dir: /etc/apt/keyrings
docker_gpg_key_path: "{{ docker_keyring_dir }}/docker.asc"

docker_repo_name: docker
docker_repo_uri: https://download.docker.com/linux/ubuntu
docker_repo_components:
  - stable
docker_repo_architectures:
  - amd64

docker_users:
  - vagrant

docker_service: docker
