apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: product-service
  namespace: devops
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: product-service
  namespaceSelector:
    matchNames:
      - devops
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s

---
