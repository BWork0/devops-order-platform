  namespace: devops
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: order-service
  namespaceSelector:
    matchNames:
      - devops
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s